<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultar Credencial</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 20px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Consulta tu Credencial</h2>
    <p>Ingresa tu DNI</p>

    <input type="text" id="dni" maxlength="8" placeholder="12345678">
    <button onclick="buscar()">Ingresar</button>
  </div>

    <script>
    function buscar() {
      let dni = document.getElementById("dni").value.trim();

      if (dni.length !== 8 || isNaN(dni)) {
        alert("Ingrese un DNI válido de 8 dígitos");
        return;
      }

      let url = "https://sites.jne.gob.pe/logindnfpe/images/20261005_" + dni + ".pdf";

      window.open(url, "_blank");
    }
  </script>


</body>
</html>
